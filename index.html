<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#6366f1">
<title>h10n 的主页</title>
<style>
:root {
  --bg: #f2f3f8;
  --card: #ffffff;
  --primary: #6366f1;
  --primary-2: #8b5cf6;
  --grad: linear-gradient(135deg, #6366f1, #8b5cf6);
  --text: #1e2233;
  --text-2: #8a90a6;
  --text-3: #b3b8ca;
  --line: #edeef5;
  --radius: 16px;
  --shadow: 0 4px 18px rgba(30, 34, 51, .06);
  --shadow-lg: 0 10px 34px rgba(30, 34, 51, .12);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "HarmonyOS Sans SC", "Segoe UI", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; border: none; background: none; cursor: pointer; color: inherit; }

.app { max-width: 560px; margin: 0 auto; min-height: 100vh; padding: 0 16px 40px; }

/* ================= 顶栏 ================= */
.top {
  display: flex; align-items: center; justify-content: space-between;
  padding: 22px 2px 18px;
}
.top-greet { font-size: 13px; color: var(--primary); font-weight: 600; letter-spacing: .5px; }
.top-date { font-size: 26px; font-weight: 800; letter-spacing: .3px; margin-top: 2px; }
.top-clock { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--text-2); }

/* ================= 天气卡片 ================= */
.weather {
  background: var(--grad);
  border-radius: 20px;
  color: #fff;
  padding: 22px 20px;
  position: relative;
  overflow: hidden;
  box-shadow: var(--shadow-lg);
  animation: rise .4s ease both;
}
.weather::after {
  content: "";
  position: absolute; right: -60px; top: -60px;
  width: 180px; height: 180px; border-radius: 50%;
  background: rgba(255, 255, 255, .1);
}
.weather::before {
  content: "";
  position: absolute; right: 40px; bottom: -80px;
  width: 160px; height: 160px; border-radius: 50%;
  background: rgba(255, 255, 255, .08);
}
.w-top { display: flex; justify-content: space-between; align-items: flex-start; position: relative; z-index: 1; }
.w-loc { display: flex; align-items: center; gap: 5px; font-size: 14px; font-weight: 600; opacity: .95; }
.w-loc svg { flex: none; }
.w-refresh {
  width: 32px; height: 32px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  background: rgba(255, 255, 255, .15);
  transition: background .2s;
}
.w-refresh:hover { background: rgba(255, 255, 255, .28); }
.w-refresh svg { transition: transform .5s ease; }
.w-refresh.spin svg { transform: rotate(360deg); }
.w-main { display: flex; align-items: center; gap: 14px; margin-top: 14px; position: relative; z-index: 1; }
.w-icon { font-size: 52px; line-height: 1; filter: drop-shadow(0 2px 6px rgba(0,0,0,.18)); }
.w-temp { font-size: 52px; font-weight: 800; line-height: 1; letter-spacing: -1px; }
.w-temp small { font-size: 24px; font-weight: 600; margin-left: 2px; }
.w-cond { font-size: 14px; font-weight: 600; opacity: .95; margin-top: 6px; }
.w-range { font-size: 13px; opacity: .85; margin-top: 2px; }
.w-details {
  display: flex; gap: 8px; margin-top: 16px;
  position: relative; z-index: 1;
}
.w-chip {
  flex: 1; text-align: center;
  background: rgba(255, 255, 255, .14);
  border-radius: 12px; padding: 8px 4px;
  backdrop-filter: blur(4px);
}
.w-chip b { display: block; font-size: 15px; font-weight: 700; }
.w-chip span { font-size: 11px; opacity: .85; }
.w-msg { position: relative; z-index: 1; text-align: center; padding: 18px 0 10px; }
.w-msg .dot { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.9); display: inline-block; margin: 0 3px; animation: blink 1.2s infinite; }
.w-msg .dot:nth-child(2) { animation-delay: .2s; }
.w-msg .dot:nth-child(3) { animation-delay: .4s; }
.w-msg p { font-size: 14px; opacity: .9; margin-top: 10px; }
.w-error { position: relative; z-index: 1; text-align: center; padding: 14px 0 8px; }
.w-error p { font-size: 14px; opacity: .95; }
.w-error button {
  margin-top: 10px; padding: 7px 18px; border-radius: 999px;
  background: rgba(255,255,255,.2); font-size: 13px; font-weight: 600;
  transition: background .2s;
}
.w-error button:hover { background: rgba(255,255,255,.32); }
@keyframes blink { 0%, 100% { opacity: .3; } 50% { opacity: 1; } }

/* ================= 项目入口 ================= */
.section-title {
  margin: 26px 4px 12px;
  font-size: 13px; font-weight: 700; color: var(--text-2); letter-spacing: 1px;
}
.projects { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.card {
  background: var(--card);
  border-radius: var(--radius);
  padding: 18px 16px;
  box-shadow: var(--shadow);
  text-decoration: none; color: inherit;
  display: flex; align-items: center; gap: 12px;
  transition: transform .18s ease, box-shadow .18s ease;
  animation: rise .4s ease both;
}
.card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
.card:active { transform: scale(.98); }
.card-icon {
  width: 44px; height: 44px; border-radius: 13px;
  display: flex; align-items: center; justify-content: center;
  font-size: 22px; flex: none; color: #fff;
}
.card-icon.todo { background: linear-gradient(135deg, #6366f1, #8b5cf6); }
.card-icon.more { background: #e3e5f0; color: var(--text-3); }
.card-name { font-size: 15px; font-weight: 700; }
.card-desc { font-size: 12px; color: var(--text-2); margin-top: 2px; }
.card-arrow { margin-left: auto; color: var(--text-3); flex: none; }

footer { text-align: center; margin-top: 36px; font-size: 12px; color: var(--text-3); }

@keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <div>
      <p class="top-greet" id="greet"></p>
      <h1 class="top-date" id="todayDate"></h1>
    </div>
    <div class="top-clock" id="clock"></div>
  </header>

  <!-- ================= 天气 ================= -->
  <section class="weather" id="weather">
    <div class="w-msg" id="wLoading">
      <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      <p id="wLoadingText">正在获取当前位置天气…</p>
    </div>
    <div id="wError" hidden>
      <div class="w-error">
        <p id="wErrorText">暂时无法获取天气信息</p>
        <button onclick="loadWeather()">重试</button>
      </div>
    </div>
    <div id="wData" hidden>
      <div class="w-top">
        <div class="w-loc">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 0 0-7 7c0 5.25 7 13 7 13s7-7.75 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg>
          <span id="wCity">—</span>
        </div>
        <button class="w-refresh" id="wRefresh" onclick="loadWeather()" title="刷新天气" aria-label="刷新天气">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><polyline points="21 3 21 9 15 9"/></svg>
        </button>
      </div>
      <div class="w-main">
        <span class="w-icon" id="wIcon">🌤️</span>
        <div>
          <div class="w-temp"><span id="wTemp">—</span><small>°C</small></div>
          <p class="w-cond" id="wCond">—</p>
          <p class="w-range" id="wRange"></p>
        </div>
      </div>
      <div class="w-details">
        <div class="w-chip"><b id="wFeels">—</b><span>体感</span></div>
        <div class="w-chip"><b id="wHumidity">—</b><span>湿度</span></div>
        <div class="w-chip"><b id="wWind">—</b><span>风速</span></div>
      </div>
    </div>
  </section>

  <!-- ================= 项目入口 ================= -->
  <h2 class="section-title">我的项目</h2>
  <div class="projects">
    <a class="card" href="todo/" style="animation-delay:.05s">
      <div class="card-icon todo">📅</div>
      <div>
        <p class="card-name">日程管家</p>
        <p class="card-desc">待办事项与日程管理</p>
      </div>
      <svg class="card-arrow" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>
    </a>
    <div class="card" style="animation-delay:.1s">
      <div class="card-icon more">＋</div>
      <div>
        <p class="card-name">敬请期待</p>
        <p class="card-desc">更多项目即将上线</p>
      </div>
    </div>
  </div>

  <footer>© <span id="year"></span> h10n · Powered by GitHub Pages</footer>
</div>

<script>
const $ = id => document.getElementById(id);

/* ================= 时间 ================= */
function pad(n) { return String(n).padStart(2, '0'); }
function tick() {
  const now = new Date();
  const h = now.getHours();
  $('greet').textContent = h < 6 ? '夜深了' : h < 9 ? '早上好' : h < 12 ? '上午好' : h < 14 ? '中午好' : h < 18 ? '下午好' : '晚上好';
  const week = ['日', '一', '二', '三', '四', '五', '六'][now.getDay()];
  $('todayDate').textContent = `${now.getMonth() + 1}月${now.getDate()}日 星期${week}`;
  $('clock').textContent = `${pad(h)}:${pad(now.getMinutes())}`;
}
tick();
setInterval(tick, 1000 * 30);
$('year').textContent = new Date().getFullYear();

/* ================= 天气 ================= */
const WMO = {
  0: ['☀️', '晴'], 1: ['🌤️', '大部晴朗'], 2: ['⛅', '多云'], 3: ['☁️', '阴'],
  45: ['🌫️', '雾'], 48: ['🌫️', '雾凇'],
  51: ['🌦️', '小毛毛雨'], 53: ['🌦️', '毛毛雨'], 55: ['🌧️', '大毛毛雨'],
  56: ['🌧️', '冻毛毛雨'], 57: ['🌧️', '强冻毛毛雨'],
  61: ['🌦️', '小雨'], 63: ['🌧️', '中雨'], 65: ['🌧️', '大雨'],
  66: ['🌧️', '冻雨'], 67: ['🌧️', '强冻雨'],
  71: ['🌨️', '小雪'], 73: ['🌨️', '中雪'], 75: ['❄️', '大雪'], 77: ['🌨️', '米雪'],
  80: ['🌦️', '小阵雨'], 81: ['🌧️', '阵雨'], 82: ['⛈️', '强阵雨'],
  85: ['🌨️', '小阵雪'], 86: ['❄️', '强阵雪'],
  95: ['⛈️', '雷阵雨'], 96: ['⛈️', '雷阵雨伴冰雹'], 99: ['⛈️', '强雷暴伴冰雹'],
};

function showLoading(text) {
  $('wData').hidden = true;
  $('wError').hidden = true;
  $('wLoading').hidden = false;
  $('wLoadingText').textContent = text || '正在获取当前位置天气…';
}

function showError(text) {
  $('wLoading').hidden = true;
  $('wData').hidden = true;
  $('wError').hidden = false;
  $('wErrorText').textContent = text || '暂时无法获取天气信息';
}

async function fetchJSON(url) {
  const res = await fetch(url);
  if (!res.ok) throw new Error(`HTTP ${res.status}`);
  return res.json();
}

async function reverseGeocode(lat, lon) {
  try {
    const d = await fetchJSON(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=zh`);
    return d.city || d.locality || d.principalSubdivision || '';
  } catch {
    return '';
  }
}

async function fetchWeather(lat, lon) {
  const d = await fetchJSON(
    `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}` +
    `&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,wind_speed_10m` +
    `&daily=temperature_2m_max,temperature_2m_min&timezone=auto`
  );
  return d;
}

function renderWeather(data, city) {
  const cur = data.current;
  const daily = data.daily;
  const [icon, desc] = WMO[cur.weather_code] || ['🌡️', '未知'];
  $('wIcon').textContent = icon;
  $('wTemp').textContent = Math.round(cur.temperature_2m);
  $('wCond').textContent = desc;
  $('wRange').textContent = `今日 ${Math.round(daily.temperature_2m_min[0])}° / ${Math.round(daily.temperature_2m_max[0])}°`;
  $('wFeels').textContent = `${Math.round(cur.apparent_temperature)}°`;
  $('wHumidity').textContent = `${Math.round(cur.relative_humidity_2m)}%`;
  $('wWind').textContent = `${Math.round(cur.wind_speed_10m)} km/h`;
  $('wCity').textContent = city || '当前位置';
  $('wLoading').hidden = true;
  $('wError').hidden = true;
  $('wData').hidden = false;
}

function cacheCoords(lat, lon) {
  try { localStorage.setItem('wx-coords', JSON.stringify({ lat, lon })); } catch {}
}

async function loadByCoords(lat, lon, silent) {
  if (!silent) showLoading('正在获取天气数据…');
  try {
    const [data, city] = await Promise.all([fetchWeather(lat, lon), reverseGeocode(lat, lon)]);
    cacheCoords(lat, lon);
    renderWeather(data, city);
  } catch {
    if (!silent) showError('天气数据获取失败，请稍后重试');
  }
}

async function locateByIP() {
  const providers = [
    async () => {
      const d = await fetchJSON('https://ipwho.is/');
      if (!d.success || d.latitude == null || d.longitude == null) throw new Error('bad');
      return [d.latitude, d.longitude];
    },
    async () => {
      const d = await fetchJSON('https://freeipapi.com/api/json');
      if (d.latitude == null || d.longitude == null) throw new Error('bad');
      return [d.latitude, d.longitude];
    },
    async () => {
      const d = await fetchJSON('https://ipinfo.io/json');
      const [lat, lon] = (d.loc || '').split(',').map(Number);
      if (!lat || !lon) throw new Error('bad');
      return [lat, lon];
    },
  ];
  for (const p of providers) {
    try { return await p(); } catch {}
  }
  throw new Error('all ip providers failed');
}

async function loadWeather() {
  const btn = $('wRefresh');
  btn.classList.add('spin');
  setTimeout(() => btn.classList.remove('spin'), 600);

  let cached = null;
  try { cached = JSON.parse(localStorage.getItem('wx-coords')); } catch {}
  if (cached && cached.lat != null) loadByCoords(cached.lat, cached.lon, true);

  const coords = await new Promise(resolve => {
    if (!navigator.geolocation) return resolve(null);
    navigator.geolocation.getCurrentPosition(
      pos => resolve([pos.coords.latitude, pos.coords.longitude]),
      () => resolve(null),
      { timeout: 8000, maximumAge: 10 * 60 * 1000 }
    );
  }).then(geo => geo || locateByIP().catch(() => null));

  if (coords) {
    loadByCoords(coords[0], coords[1], !!cached);
  } else if (!cached) {
    showError('无法获取位置信息，请检查网络或授权定位');
  }
}

loadWeather();
</script>
</body>
</html>
