<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#6366f1">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>日程管家</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">

  <!-- ================= 日程 ================= -->
  <main class="page active" data-page="today">
    <header class="top">
      <div class="top-info">
        <p class="top-greet" id="greet"></p>
        <h1 class="top-date" id="todayDate"></h1>
      </div>
      <div class="ring-wrap" id="ringWrap" hidden>
        <svg class="ring" viewBox="0 0 60 60">
          <circle class="ring-bg" cx="30" cy="30" r="26"/>
          <circle class="ring-fg" id="ringFg" cx="30" cy="30" r="26"/>
        </svg>
        <span class="ring-text" id="ringText"></span>
      </div>
    </header>

    <div class="quick-row">
      <button class="chip-btn" id="btnAll">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="6" cy="6" r="2.4"/><circle cx="17" cy="6" r="2.4"/><circle cx="6" cy="18" r="2.4"/><path d="M9.5 6h5M6 9.5V15M9.5 18h5M17 9.5V15"/></svg>
        全部事项
      </button>
      <button class="chip-btn accent" id="btnAdd1">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        新建日程
      </button>
    </div>

    <section>
      <h2 class="sec-title">现在应处理 <span class="count-pill" id="dueCount">0</span></h2>
      <div class="task-list" id="dueList"></div>
      <div class="empty" id="dueEmpty" hidden>
        <div class="empty-ic">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 12.5l2.5 2.5 4.5-5.5"/></svg>
        </div>
        <p class="empty-t">今天没有待处理的事项</p>
        <p class="empty-s">点击下方按钮添加一个日程吧</p>
        <button class="btn-primary" id="btnAdd2">添加日程</button>
      </div>
    </section>

    <section id="doneSec" hidden>
      <h2 class="sec-title">已完成 <span class="count-pill green" id="doneCount">0</span></h2>
      <div class="task-list" id="doneList"></div>
    </section>

    <section id="skipSec" hidden>
      <h2 class="sec-title">已跳过 <span class="count-pill gray" id="skipCount">0</span></h2>
      <div class="task-list" id="skipList"></div>
    </section>

    <button class="fab" id="fabAdd" aria-label="新建日程">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <div class="page-pad"></div>
  </main>

  <!-- ================= 倒数日 ================= -->
  <main class="page" data-page="countdown">
    <header class="top">
      <div class="top-info">
        <p class="top-greet">时光纪念</p>
        <h1 class="top-date">倒数日</h1>
      </div>
      <button class="icon-btn top-add" id="btnAddCd" aria-label="添加倒数日">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </header>
    <div class="cd-grid" id="cdGrid"></div>
    <div class="empty" id="cdEmpty" hidden>
      <div class="empty-ic">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3.5h11M6.5 20.5h11M7.5 3.5c0 3.8 4.5 5.6 4.5 8.5s-4.5 4.7-4.5 8.5M16.5 3.5c0 3.8-4.5 5.6-4.5 8.5s4.5 4.7 4.5 8.5"/></svg>
      </div>
      <p class="empty-t">还没有倒数日</p>
      <p class="empty-s">记录重要的日子，等待值得期待</p>
      <button class="btn-primary" id="btnAddCd2">添加倒数日</button>
    </div>
    <div class="page-pad"></div>
  </main>

  <!-- ================= 统计 ================= -->
  <main class="page" data-page="stats">
    <header class="top">
      <div class="top-info">
        <p class="top-greet">数据回顾</p>
        <h1 class="top-date">统计</h1>
      </div>
    </header>

    <div class="stat-cards">
      <div class="stat-card">
        <span class="st-ic" style="--c:#10b981"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>
        <p class="stat-num" id="sTodayDone">0</p>
        <p class="stat-label">今日完成</p>
      </div>
      <div class="stat-card">
        <span class="st-ic" style="--c:#f59e0b"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 12h9M12.5 8.5 16 12l-3.5 3.5"/></svg></span>
        <p class="stat-num" id="sTodaySkip">0</p>
        <p class="stat-label">今日跳过</p>
      </div>
      <div class="stat-card">
        <span class="st-ic" style="--c:#6366f1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20.5V11M10 20.5V4.5M16 20.5v-9M21 20.5H3.5"/></svg></span>
        <p class="stat-num" id="sRate">—</p>
        <p class="stat-label">总完成率</p>
      </div>
      <div class="stat-card">
        <span class="st-ic" style="--c:#f43f5e"><svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M12 2.5c.8 2.9-2.3 4.6-2.3 7.2a3.6 3.6 0 0 0 7.1.6c1.3-1.4 1.7-3.2 1.7-5 3 1.9 4.5 4.9 4.5 8a9 9 0 0 1-18 0c0-2.3 1.1-4.3 2.1-5.9.9 1 1.7 1.8 2.9 2.6.4-2.5 0-4.7 2-7.5z"/></svg></span>
        <p class="stat-num" id="sStreak">0</p>
        <p class="stat-label">连续打卡(天)</p>
      </div>
    </div>
    <p class="stat-total" id="statTotal"></p>

    <section class="card chart-card">
      <h3 class="card-title">每日完成 · 近 14 天</h3>
      <div class="bars" id="chartDaily"></div>
      <div class="legend">
        <span><i class="dot d"></i>完成</span>
        <span><i class="dot s"></i>跳过</span>
      </div>
    </section>

    <section class="card chart-card">
      <h3 class="card-title">每月完成 · 近 6 个月</h3>
      <div class="bars" id="chartMonthly"></div>
      <div class="legend">
        <span><i class="dot d"></i>完成</span>
        <span><i class="dot s"></i>跳过</span>
      </div>
    </section>

    <section class="card">
      <h3 class="card-title">事项连续完成</h3>
      <div id="streakList"></div>
      <div class="empty small" id="streakEmpty" hidden>
        <p class="empty-t">暂无数据</p>
        <p class="empty-s">完成一些日程后，这里会展示每个事项的连续记录</p>
      </div>
    </section>
    <div class="page-pad"></div>
  </main>

  <!-- ================= 底部导航 ================= -->
  <nav class="tabbar">
    <button class="tab active" data-tab="today">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3"/><path d="M8 3v4M16 3v4M3.5 10.5h17"/><path d="m9.2 15.2 2 2 3.6-4"/></svg>
      <span>日程</span>
    </button>
    <button class="tab" data-tab="countdown">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 3.5h11M6.5 20.5h11M7.5 3.5c0 3.8 4.5 5.6 4.5 8.5s-4.5 4.7-4.5 8.5M16.5 3.5c0 3.8-4.5 5.6-4.5 8.5s4.5 4.7 4.5 8.5"/></svg>
      <span>倒数日</span>
    </button>
    <button class="tab" data-tab="stats">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20.5V11M10 20.5V4.5M16 20.5v-9M21 20.5H3.5"/></svg>
      <span>统计</span>
    </button>
  </nav>

  <!-- ================= 新建/编辑日程 ================= -->
  <div class="mask" id="taskModal">
    <div class="sheet">
      <div class="sheet-head">
        <h2 id="tmTitle">新建日程</h2>
        <button class="icon-btn" data-close aria-label="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="sheet-body">
        <label class="field">
          <span>事项名称</span>
          <input id="tmName" maxlength="30" placeholder="要做什么？">
        </label>
        <div class="field">
          <span>重复</span>
          <div class="seg" id="tmRepeat">
            <button data-r="none" class="active">一次性</button>
            <button data-r="daily">每日</button>
            <button data-r="weekly">每周</button>
            <button data-r="monthly">每月</button>
          </div>
        </div>
        <label class="field" id="tmDateWrap">
          <span>日期</span>
          <input type="date" id="tmDate">
        </label>
        <div class="field" id="tmWeekWrap" hidden>
          <span>每周几</span>
          <div class="chips" id="tmWeek"></div>
        </div>
        <label class="field" id="tmMonthWrap" hidden>
          <span>每月几号</span>
          <select id="tmMonthDay"></select>
        </label>
        <div class="field-row">
          <label class="field">
            <span>时间(可选)</span>
            <input type="time" id="tmTime">
          </label>
          <label class="field">
            <span>备注(可选)</span>
            <input id="tmNote" maxlength="50" placeholder="补充说明">
          </label>
        </div>
        <div class="field">
          <span>颜色</span>
          <div class="swatches" id="tmColors"></div>
        </div>
      </div>
      <div class="sheet-foot">
        <button class="btn-danger-ghost" id="tmDelete" hidden>删除</button>
        <button class="btn-primary grow" id="tmSave">保存</button>
      </div>
    </div>
  </div>

  <!-- ================= 全部事项 ================= -->
  <div class="mask" id="allSheet">
    <div class="sheet tall">
      <div class="sheet-head">
        <h2>全部事项</h2>
        <button class="icon-btn" data-close aria-label="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="all-list" id="allList"></div>
      <div class="empty" id="allEmpty" hidden>
        <p class="empty-t">还没有任何事项</p>
        <p class="empty-s">从「日程」页添加第一个事项吧</p>
      </div>
    </div>
  </div>

  <!-- ================= 新建/编辑倒数日 ================= -->
  <div class="mask" id="cdModal">
    <div class="sheet">
      <div class="sheet-head">
        <h2 id="cdmTitle">添加倒数日</h2>
        <button class="icon-btn" data-close aria-label="关闭">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
        </button>
      </div>
      <div class="sheet-body">
        <label class="field">
          <span>名称</span>
          <input id="cdmName" maxlength="20" placeholder="例如：生日、考试、纪念日">
        </label>
        <div class="field">
          <span>类型</span>
          <div class="seg" id="cdmType">
            <button data-t="countdown" class="active">倒数日</button>
            <button data-t="anniv">纪念日</button>
          </div>
        </div>
        <label class="field">
          <span>日期</span>
          <input type="date" id="cdmDate">
        </label>
        <div class="field">
          <span>图标</span>
          <div class="emoji-grid" id="cdmIcons"></div>
        </div>
        <div class="field">
          <span>颜色</span>
          <div class="swatches" id="cdmColors"></div>
        </div>
      </div>
      <div class="sheet-foot">
        <button class="btn-danger-ghost" id="cdmDelete" hidden>删除</button>
        <button class="btn-primary grow" id="cdmSave">保存</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>
  <div id="confetti"></div>
</div>
<script src="app.js"></script>
</body>
</html>
